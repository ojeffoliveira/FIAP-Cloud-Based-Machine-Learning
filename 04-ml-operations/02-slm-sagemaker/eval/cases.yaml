# Casos sintéticos do gate generativo do SLM de retenção da Bora Fibra.
#
# Nenhum campo abaixo é dado real de cliente: schema e valores seguem o
# exemplo do §8 da spec (probabilidade_churn, faixa_tempo_cliente, plano,
# uso, chamados_90d, atraso_pagamento) — os mesmos seis campos que o modelo
# de churn (04.1) já calcula, nunca nome/CPF/telefone/e-mail/endereço.
#
# `checks.deve_mencionar_algum` é satisfeito com QUALQUER UM dos termos (não
# todos) — é um piso de relevância semântica, não um exact-match; um SLM de
# 0,5B parâmetros varia de frase para frase, então o gate tem que aceitar
# qualquer termo plausível para a mesma ideia (ex.: "contato" ou "ligação").
# `checks.nao_deve_inventar` é o oposto: a resposta REPROVA se citar qualquer
# um destes termos, porque nenhum deles está no contexto enviado ao modelo
# (ver src/lab42/evaluation.py:check_nao_inventou).
#
# Os 8 casos cobrem situações distintas de negócio, não variações cosméticas
# do mesmo caso: risco alto por queda de uso, risco alto por volume de
# chamados, risco médio por atraso de pagamento, risco baixo (ação
# proporcional, sem alarme), cliente recente vs. cliente antigo, e mais de
# um plano.

- id: caso_01
  contexto:
    probabilidade_churn: 0.87
    faixa_tempo_cliente: 24-36 meses
    plano: fibra_500
    uso: queda_acentuada_30d
    chamados_90d: 1
    atraso_pagamento: baixo
  checks:
    idioma: pt-BR
    deve_mencionar_algum:
      - contato
      - suporte
      - atendimento
      - conexão
      - internet
    nao_deve_inventar:
      - CPF
      - telefone
      - endereço
      - e-mail
      - valor de desconto específico

