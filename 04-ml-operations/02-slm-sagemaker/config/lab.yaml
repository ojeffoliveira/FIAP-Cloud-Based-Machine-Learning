# Fonte única de verdade do lado Python/Terraform do Lab 04.2.
#
# Continua a mesma disciplina do 04.1: nenhum script ou módulo .tf hardcoda um
# valor que também precisa existir aqui. O que muda de lab para lab é o
# CONTEÚDO deste arquivo, nunca o hábito de consultá-lo.
#
# Marcadores `<<A2>>`: valor que só pode ser CONGELADO depois de o preflight de
# runtime (resolve_runtime.py, dono: A2) medir de verdade contra o DLC e o
# endpoint reais. Até lá, o valor aqui é o TETO de projeto (o que o README e o
# Terraform assumem por padrão), não uma medição. Substituir um `<<A2>>` por um
# número sem ter rodado o preflight é inventar dado — proibido pelo contrato do
# lab.

schema_version: "1.0.0"

region: us-east-1

aws:
  execution_role_name: LabRole
  instance_profile_name: LabInstanceProfile
  # Todo nome de recurso do lab começa por este prefixo. Nenhum script ou .tf
  # pode hardcodear um nome de recurso fora de prefixo+sufixo.
  bucket_prefix: fiap-cbml-42

# Regra do sufixo determinístico (blueprint §1): nunca nome de aluno.
#
#   suffix = sha256(f"{account_id}:{github_owner}")[:8]   (hex, minúsculo)
#
# `account_id` vem de sts.get_caller_identity() (aws.account_id()).
# `github_owner` é resolvido em ordem, e falha explícita (LabError) se nenhuma
# fonte existir — nunca cai para nome de aluno como último recurso:
#   1. env GITHUB_REPOSITORY_OWNER (presente nos runners do GitHub Actions);
#   2. `git config --get remote.origin.url` do próprio checkout, parseado;
naming:
  suffix_algorithm: "sha256(account_id + ':' + github_owner)[:8]"
  # Todos os placeholders abaixo são resolvidos em tempo de execução por
  # src/lab42/aws.py (suffix(), account_id()) — nenhum script os reescreve à
  # mão. `<account>` = account id de 12 dígitos; `<hash8>` = suffix; `<suffix>`
  # é o mesmo valor de `<hash8>`, repetido aqui porque a spec usa os dois nomes
  # em contextos diferentes (bucket vs. recurso de negócio).
  bucket_state: "fiap-cbml-42-tfstate-<account>-<hash8>"
  bucket_state_key: "04-2/slm/terraform.tfstate"
  bucket_artifacts: "fiap-cbml-42-models-<account>-<hash8>"
  endpoint_v1: "fiap-cbml-42-slm-v1-<suffix>"
  endpoint_v2: "fiap-cbml-42-slm-v2-<suffix>"
  dashboard: "fiap-mlops-slm-<suffix>"

# O 04.2 não reescreve o churn-v1: ele consome o score que o 04.1 já produz e
# adiciona uma capacidade nova (recomendação em texto). A linhagem do SLM é
# registrada separada da linhagem do modelo de churn, para as duas serem
# auditáveis de forma independente (ex.: destruir o SLM não apaga a linhagem
# do churn, e vice-versa).
lineage:
  source_lab: "04.1-observability-drift-response"
  business_capability: "bora-fibra-retention-copilot"
  model_lineage: "bora-retention-slm"
  upstream_model_lineage: "churn-v1"

# Runner self-hosted efêmero (terraform/runner, dono: A5). Vive só durante a
# janela do deploy V2; nunca fica de pé fora da aula (guardrail de custo).
runner:
  instance_type: t3.medium
  ebs_gb: 30
  ebs_volume_type: gp3
  ami_os: ubuntu-22.04-lts-x86_64
  github_actions_label: academy-slm-deploy
  security_group:
    inbound: []
    outbound_tcp: [443]
  imds:
    http_endpoint: enabled
    http_tokens: required
    http_put_response_hop_limit: 1

# SageMaker (terraform/slm, dono: A6). ml.m5.xlarge é o baseline aprovado nos
# guardrails do Academy para CPU inference com o DLC llama.cpp — nunca GPU.
sagemaker:
  instance_type: ml.m5.xlarge
  v1:
    fixed_capacity: 1
  v2:
    autoscaling:
      min_capacity: 1
      max_capacity: 2
      target_metric: SageMakerVariantInvocationsPerInstance
      # Medido em 2026-09-12 (benchmark.py --release v1, 15 req sequenciais):
      # p95=2624.9ms. throughput_max_serializado = 60/2,6249 ≈ 22,86 inv/min;
      # margem de 65% (mesmo raciocínio de terraform/slm/autoscaling.tf):
      # 22,86 * 0,65 ≈ 14,86 → 15. Diverge do local hardcoded (20) em
      # terraform/slm/autoscaling.tf, que usa o probe antigo (p95=1,96s) —
      # divergência real registrada em execucao-real.md, não corrigida aqui
      # (fora do escopo: só preenche lab.yaml, não edita .tf).
      target_value: 15
      # Cooldowns assimétricos por design (mesmo princípio de
      # terraform/slm/autoscaling.tf): scale-out curto (60s) porque uma nova
      # ml.m5.xlarge já demora minutos para ficar InService — medido nesta
      # execução: 2min03s (23:28:20->23:30:23 -03:00); scale-in mais longo
      # (300s) evita destruir/recriar capacidade por queda passageira.
      scale_out_cooldown_s: 60
      scale_in_cooldown_s: 300

# Parâmetros de inferência do SLM (dono do runtime: A2/A8). Nenhum destes é um
# chute de conforto — cada `<<A2>>` é preenchido pelo preflight de
# resolve_runtime.py contra o DLC e o endpoint reais, nunca por analogia com o
# limite teórico do modelo.
inference:
  # Confirmado por resolve_runtime.py (preflight A2, 2026-09-12): LLAMA_ARG_CTX_SIZE
  # provado no log do llama-server como n_ctx=2048.
  max_context_tokens: 2048
  # Confirmado por resolve_runtime.py (preflight A2). ACHADO REAL (evaluate.py
  # --release v1, 2026-09-12): com 64 tokens, 8/8 casos deram finish_reason=length
  # (resposta cortada no meio da frase) — o teto de projeto NÃO se mostrou
  # suficiente para o contrato de 2-3 frases na prática; ver execucao-real.md.
  max_output_tokens: 64
  # Temperatura 0 é decisão de design (reprodutibilidade de smoke/eval), não de
  # medição — não carrega marcador.
  temperature: 0.0
  # Medido em 2026-09-12 (benchmark.py --release v1, 15 req sequenciais,
  # max_tokens=64): p50=2580.9ms, p95=2624.9ms. p95_max = round(2624.9*1,3)
  # arred. 50ms = 3400 (valor gerado pelo próprio benchmark.py, gravado em
  # .generated/runtime.json). p50_max = 2580.9ms arredondado para cima ao
  # múltiplo de 50ms (sem margem de cauda — só arredondamento; nenhum script
  # do lab hoje faz enforcement de p50_max, só de p95_max em evaluation.py).
  latency_envelope_ms:
    p50_max: 2600
    p95_max: 3400

# Tags propagadas em todo recurso AWS do lab (SageMaker, S3, EC2, CloudWatch),
# amarrando por API a origem e a capacidade de negócio — o mesmo mecanismo do
# 04.1, sem reinventar chave de tag nova.
tags:
  lab: "04-2-slm-sagemaker"
  business_capability: "bora-fibra-retention-copilot"
  model_lineage: "bora-retention-slm"
  managed_by: terraform
