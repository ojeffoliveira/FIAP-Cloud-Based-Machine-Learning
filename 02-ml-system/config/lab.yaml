# Fonte única de verdade para o lado Python do Lab 02.
# As constantes do lado Terraform (URI da imagem, tipos de instância,
# hiperparâmetros) vivem em terraform/variables.tf, para a IaC continuar legível
# por si só; os valores de que os DOIS lados dependem são os prefixos do S3, e
# eles fluem dos outputs do Terraform para o Python (nunca o contrário).

schema_version: "1.0.0"

region: us-east-1

# Espelhado em terraform/variables.tf. Mantenha os dois em sincronia à mão: não
# existe verificação automática, e o verify-clean precisa achar o bucket depois de
# o `destroy` já ter jogado fora os outputs do Terraform.
aws:
  execution_role_name: LabRole
  bucket_prefix: prb-cloud-ml-lab1

dataset:
  seed: 20260817
  rows: 4000
  label: churn
  id_column: observation_id
  feature_order:
    - tenure_months
    - monthly_charges
    - support_calls_90d
    - payment_delay_days
    - usage_score
    - annual_contract
    - premium_plan
  split:
    train: 0.70
    validation: 0.15
    test: 0.15

# Limites viáveis, cobrados por scripts/validate_data.py. São limites de contrato,
# não os parâmetros de distribuição do gerador: um valor fora deles significa que
# o gerador ou o arquivo saiu do lugar.
bounds:
  tenure_months: [1, 72]
  monthly_charges: [20.0, 260.0]
  support_calls_90d: [0, 30]
  payment_delay_days: [0.0, 45.0]
  usage_score: [5.0, 100.0]
  annual_contract: [0, 1]
  premium_plan: [0, 1]

# Faixa alargada em torno do ~1/3 que o gerador de fato produz. Uma execução fora
# dessa banda significa que o gerador mudou, e todo limiar a jusante fica suspeito.
prevalence_range: [0.20, 0.50]

min_rows_per_split: 400

acceptance:
  roc_auc_min: 0.75
  f1_min: 0.50
  must_beat_majority_accuracy: true
  decision_threshold: 0.5
